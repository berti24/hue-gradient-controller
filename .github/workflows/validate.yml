name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        env:
          # Avoid branch raw-content lookups and validate the actual PR head.
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
