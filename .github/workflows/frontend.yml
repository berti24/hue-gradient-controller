name: Frontend

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hue-gradient-light-card
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hue-gradient-light-card/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.14.2"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git -C .. diff --exit-code -- custom_components/hue_gradient_controller/www
      - run: npm run test:prepare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
